# Postgres (`docker compose up db`, for trying production's database locally; development defaults to SQLite),
# and the full edition on it (`docker compose --profile app up --build`).
name: terrastra
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: terrastra
      POSTGRES_PASSWORD: terrastra
      POSTGRES_DB: terrastra
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terrastra"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: [app]
    build: { context: ., target: migrate }
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://terrastra:terrastra@db:5432/terrastra

  app:
    profiles: [app]
    build: { context: ., target: app }
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://terrastra:terrastra@db:5432/terrastra
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_API_URL: ${MAIL_API_URL:-}
      MAIL_API_KEY: ${MAIL_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOOGLE_ID: ${GOOGLE_ID:-}
      GOOGLE_SECRET: ${GOOGLE_SECRET:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  pgdata:
